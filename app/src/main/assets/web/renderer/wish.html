<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>许愿墙</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="wish.css">
</head>
<body>
<!-- 许愿墙（11-12）：页面按 1024×1536 的设计稿画，脚本按窗口宽度整体等比缩（窗口 440×660）。
     别人写的字一律 textContent；图标只认下面这十个编号。页面不联网，联网全在主进程（见 wishpreload.js）。 -->
<svg width="0" height="0" class="defs" aria-hidden="true">
  <symbol id="i-bulb" viewBox="0 0 64 64"><circle cx="32" cy="25" r="17" fill="#FFD84A" stroke="#C9971E" stroke-width="3"/><path d="M25 29l7-8 7 8" fill="none" stroke="#C9971E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="43" width="16" height="8" rx="3" fill="#9AA0AB" stroke="#5B606B" stroke-width="2.6"/><rect x="27" y="52" width="10" height="5" rx="2.5" fill="#6B707B"/></symbol>
  <symbol id="i-screens" viewBox="0 0 64 64"><g stroke="#2C3E5A" stroke-width="3" stroke-linejoin="round"><rect x="3" y="18" width="26" height="19" rx="2.5" fill="#5BA0E6"/><path d="M1 44h30l-3-6H4z" fill="#4A4F5A"/><rect x="35" y="18" width="26" height="19" rx="2.5" fill="#5BA0E6"/><path d="M33 44h30l-3-6H36z" fill="#4A4F5A"/></g></symbol>
  <symbol id="i-sliders" viewBox="0 0 64 64"><g stroke="#5E6470" stroke-width="4" stroke-linecap="round"><path d="M8 16h48M8 32h48M8 48h48"/></g><g fill="#EEF1F6" stroke="#5E6470" stroke-width="3"><circle cx="22" cy="16" r="6"/><circle cx="42" cy="32" r="6"/><circle cx="28" cy="48" r="6"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 64 64"><rect x="18" y="5" width="28" height="54" rx="6" fill="#1F2B4A" stroke="#10182D" stroke-width="3"/><rect x="22" y="12" width="20" height="38" rx="2" fill="#4C86D9"/><circle cx="32" cy="55" r="1.8" fill="#8FA0C8"/></symbol>
  <symbol id="i-mute" viewBox="0 0 64 64"><path d="M8 24h10l14-11v38L18 40H8z" fill="#AEB4C0" stroke="#5B606B" stroke-width="3" stroke-linejoin="round"/><path d="M40 24q7 8 0 16M46 18q12 14 0 28" fill="none" stroke="#5B606B" stroke-width="3" stroke-linecap="round"/><path d="M10 54L56 10" stroke="#5B606B" stroke-width="5" stroke-linecap="round"/></symbol>
  <symbol id="i-shirt" viewBox="0 0 64 64"><path d="M22 8L6 18l7 12 7-4v30h24V26l7 4 7-12L42 8q-10 9-20 0z" fill="#F2A257" stroke="#B86A22" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 64 64"><path d="M32 56C10 41 5 27 11 17c6-9 18-6 21 3 3-9 15-12 21-3 6 10 1 24-21 39z" fill="#F0627F" stroke="#B93555" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 64 64"><path d="M32 5l8 18 20 2-15 13 5 20-18-10-18 10 5-20L4 25l20-2z" fill="#FFCF3E" stroke="#C9971E" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#fff" stroke="#4A86D1" stroke-width="5"/><path d="M32 16v17l11 7" fill="none" stroke="#3A5A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bug" viewBox="0 0 64 64"><g stroke="#7A2E1C" stroke-width="3" stroke-linecap="round"><path d="M18 26l-9-6M18 38l-10 1M20 49l-8 8M46 26l9-6M46 38l10 1M44 49l8 8"/></g><ellipse cx="32" cy="38" rx="14" ry="18" fill="#D9573B" stroke="#7A2E1C" stroke-width="3"/><circle cx="32" cy="16" r="9" fill="#7A2E1C"/><path d="M32 22v32" stroke="#7A2E1C" stroke-width="2.5"/><circle cx="25" cy="34" r="3" fill="#7A2E1C"/><circle cx="39" cy="34" r="3" fill="#7A2E1C"/><circle cx="26" cy="46" r="2.6" fill="#7A2E1C"/><circle cx="38" cy="46" r="2.6" fill="#7A2E1C"/></symbol>
</svg>

<div id="stage">
  <div id="scene">
    <img id="bg" src="../assets/wish/bg.jpg" alt="" draggable="false">
    <div id="drag"></div>
    <img id="cat" src="../assets/wish/cat.png" alt="" draggable="false">
    <div id="hang" hidden><i class="rope l"></i><i class="rope r"></i></div>
    <div id="rows"></div>
    <div id="empty" hidden><i class="rope l"></i><i class="rope r"></i><div class="card"><i class="skin pill"></i><img class="signimg" src="../assets/wish/sign.png" alt="" draggable="false" hidden><b>还没有人许愿</b><span>第一个愿望会挂在这里</span></div></div>
    <div id="offline" hidden><i class="rope l"></i><i class="rope r"></i><div class="card"><i class="skin plank"></i><span>信号不好，过会儿再来</span></div></div>
    <button id="add" type="button"><i class="skin pill"></i><span>我也想提一个</span></button>
  </div>
  <div id="veil"></div>

  <section id="board" aria-hidden="true">
    <img class="boardimg" src="../assets/wish/board.png" alt="" draggable="false">
    <div class="inner">
      <div class="tabs">
        <button type="button" class="tab on" id="tab-wish">想要个功能</button>
        <button type="button" class="tab" id="tab-bug">遇到问题了</button>
      </div>
      <div class="form">
        <div class="lab"><span id="lab-title">一句话说说</span></div>
        <input id="f-title" type="text" maxlength="20" autocomplete="off" spellcheck="false">
        <div class="lab"><span id="lab-detail">详细说说（可不填）</span></div>
        <textarea id="f-detail" maxlength="300" spellcheck="false"></textarea>
        <div class="lab"><span>配图（可不填，最多3张）</span></div>
        <div class="pics" id="pics"><button type="button" class="addpic" id="addpic"><b>+</b><span>截图或粘贴</span></button></div>
        <div id="bugopts" hidden>
          <label class="chk"><input type="checkbox" id="f-log" checked><i></i><span>附上小黑的运行记录，帮作者查问题</span></label>
          <div class="lock"><svg viewBox="0 0 24 24" width="40" height="40"><rect x="4" y="10" width="16" height="12" rx="3" fill="#F5E3C0"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#F5E3C0" stroke-width="2.6" stroke-linecap="round"/></svg><span>问题只有作者能看到</span></div>
        </div>
        <div id="similar" hidden><div class="lab"><span>有人提过差不多的</span></div><div id="simrows"></div></div>
        <div class="msg" id="msg"></div>
        <div class="btns">
          <button type="button" class="go" id="go">挂上去</button>
          <button type="button" class="no" id="no">算了</button>
        </div>
      </div>
    </div>
  </section>

  <div id="bubble" hidden><span></span></div>
  <button id="x" type="button" aria-label="关闭">✕</button>
</div>
<script src="wish.js"></script>
</body>
</html>
