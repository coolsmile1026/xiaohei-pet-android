<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>这不是官方版本的小黑</title>
<style>
  /* 被改过的安装包弹这张卡片：样子照 welcome.html（奶白底深棕边，薄荷绿主按钮） */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 10px; font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: #3B2A1E; user-select: none; }
  .card { position: relative; background: #FFFDF7; border: 2px solid #4A3424; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.22); padding: 16px 18px 14px; }
  .head { display: flex; align-items: center; gap: 12px; -webkit-app-region: drag; }
  .head img { width: 52px; height: 52px; flex: none; }
  .name { font-size: 18px; font-weight: bold; line-height: 1.3; }
  .x { position: absolute; right: 8px; top: 6px; width: 26px; height: 26px; border: none; background: none; font-size: 18px; color: #8a7766; cursor: pointer; border-radius: 13px; -webkit-app-region: no-drag; }
  .x:hover { background: #f1e9dc; }
  .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eadfcf; }
  p { margin: 0 0 4px; font-size: 14px; }
  button.b { flex: none; font: inherit; font-size: 13px; padding: 3px 14px; border: 1.5px solid #4A3424; border-radius: 15px; background: #fff; color: #3B2A1E; cursor: pointer; }
  button.b:hover { background: #f7f0e4; }
  button.b.main { background: #A6D29A; border-color: #4E8A4A; color: #1F3A1D; font-weight: bold; }
  button.b.main:hover { background: #95C688; }
  .foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .gnotice { font-size: 13px; color: #3f7a3b; margin-bottom: 6px; }
  .gc { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #e6e6e6; border-radius: 10px; padding: 10px; margin-top: 8px; }
  .gc:first-child { margin-top: 0; }
  .gc .qr { flex: none; width: 124px; height: 124px; padding: 4px; background: #fff; }
  .gc .gq { flex: 1; }
  .gc .gn { font-size: 14px; font-weight: bold; color: #222; }
  .gc .gd, .gc .tip { font-size: 12px; color: #8a8a8a; line-height: 1.4; margin-top: 3px; }
  .gc .gd b { color: #3B2A1E; font-size: 14px; user-select: text; }
  .gqrs { display: flex; gap: 10px; }
  .gqrs:not(:first-child) { margin-top: 8px; }
  .gc.gcv { flex: 1; flex-direction: column; align-items: center; text-align: center; margin-top: 0; }
  .gfull { font-size: 13px; color: #5b4a3c; }
</style>
</head>
<body>
<div class="card">
  <button class="x" data-do="close" title="关闭">×</button>
  <div class="head"><img src="../assets/tray.png" alt=""><div class="name">这不是官方版本的小黑</div></div>
  <div class="sec">
    <p>这个小黑被人改过，可能不安全。官方版永久免费，请到下面的群里下载正版。</p>
  </div>
  <div class="sec">
    <div id="groups"></div>
  </div>
  <div class="foot"><button class="b main" data-do="close">知道了</button></div>
</div>
<script src="groupcard.js"></script>
<script>
const { ipcRenderer } = require('electron');
function show(s) {
  renderGroups(document.getElementById('groups'), s || {}, (s && s.visible) || []);
  requestAnimationFrame(() => ipcRenderer.send('notofficial-size', document.body.scrollHeight));
}
ipcRenderer.invoke('groups-state').then(show);
document.body.addEventListener('click', (e) => { const b = e.target.closest('[data-do]'); if (b) ipcRenderer.send('notofficial-do', b.dataset.do); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') ipcRenderer.send('notofficial-do', 'close'); });
</script>
</body>
</html>
