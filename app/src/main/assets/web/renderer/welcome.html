<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>欢迎来到罗小黑大家庭</title>
<style>
  /* 欢迎卡片（一页）：教程视频＋作者和进群＋开机自启勾选。和「关于」同一套样子，奶白底深棕边，主按钮用小黑耳朵里的薄荷绿 */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 10px; font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: #3B2A1E; user-select: none; }
  .card { position: relative; width: 600px; background: #FFFDF7; border: 2px solid #4A3424; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.22); padding: 16px 18px 14px; }
  .head { display: flex; align-items: center; gap: 12px; -webkit-app-region: drag; }
  .head img { width: 52px; height: 52px; flex: none; }
  .name { font-size: 18px; font-weight: bold; line-height: 1.3; }
  .x { position: absolute; right: 8px; top: 6px; width: 26px; height: 26px; border: none; background: none; font-size: 18px; color: #8a7766; cursor: pointer; border-radius: 13px; -webkit-app-region: no-drag; }
  .x:hover { background: #f1e9dc; }
  .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eadfcf; }
  p { margin: 0 0 4px; font-size: 14px; }
  .author { font-size: 13px; color: #5b4a3c; }
  .muted { color: #8a7766; font-size: 12px; margin-top: 8px; }
  button.b { flex: none; font: inherit; font-size: 13px; padding: 3px 14px; border: 1.5px solid #4A3424; border-radius: 15px; background: #fff; color: #3B2A1E; cursor: pointer; }
  button.b:hover { background: #f7f0e4; }
  button.b.main { background: #A6D29A; border-color: #4E8A4A; color: #1F3A1D; font-weight: bold; }
  button.b.main:hover { background: #95C688; }
  .foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 10px; }
  .gnotice { font-size: 13px; color: #3f7a3b; margin-bottom: 6px; }
  .gc { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #e6e6e6; border-radius: 10px; padding: 10px; margin-top: 8px; }
  .gc:first-child { margin-top: 0; }
  .gc .qr { flex: none; width: 124px; height: 124px; padding: 4px; background: #fff; }
  .gc .gq { flex: 1; }
  .gc .gn { font-size: 14px; font-weight: bold; color: #222; }
  .gc .gd, .gc .tip { font-size: 12px; color: #8a8a8a; line-height: 1.4; margin-top: 3px; }
  .gc .gd b { color: #3B2A1E; font-size: 14px; user-select: text; }
  .gqrs { display: flex; gap: 10px; }
  .gqrs:not(:first-child) { margin-top: 8px; }
  .gc.gcv { flex: 1; flex-direction: column; align-items: center; text-align: center; margin-top: 0; }
  .gfull { font-size: 13px; color: #5b4a3c; }
  /* 第 1 页教程播放器（舞台、字幕、分集按钮） */
  /* 一页：左舞台＋右分集按钮，下面一横条（文字＋群列表），底栏开机勾选＋知道了 */
  .card { width: 700px; padding: 14px 18px 12px; }
  .hsub { font-size: 13px; color: #6b5a4c; line-height: 1.5; }
  .top { display: flex; gap: 10px; margin-top: 8px; }
  .vid { width: 460px; flex: none; }
  .stage { position: relative; overflow: hidden; width: 460px; height: 259px; border-radius: 10px 10px 0 0; background: radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #F6EEDF 55%, #EADCC4 100%); }
  .stage .menu { font-size: 10px; line-height: 1.2; padding: 2px; min-width: 150px; }
  .stage .menu div { padding: 1.5px 9px; }
  .stage .menu hr { margin: 2px 0; }
  .sub { background: #2b211a; color: #fff; text-align: center; font-size: 14px; padding: 5px 0; border-radius: 0 0 10px 10px; min-height: 31px; line-height: 1.6; }
  .chips { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .ch { white-space: nowrap; display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 8px 3px 4px; border: 1px solid #e0d4c2; border-radius: 13px; color: #5b4a3c; cursor: pointer; }
  .ch:hover { background: #f7f0e4; }
  .ch b { width: 19px; height: 19px; border-radius: 10px; background: #eadfcf; color: #4A3424; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .ch.on { background: #EAF5E6; border-color: #7FBF72; color: #1F3A1D; font-weight: bold; }
  .ch.on b { background: #4E8A4A; color: #fff; }
  .home { display: flex; gap: 12px; margin-top: 6px; padding-top: 8px; border-top: 1px solid #eadfcf; }
  .home .txt { flex: 1; font-size: 13px; line-height: 1.55; }
  .home .txt p { margin: 0 0 3px; font-size: 13px; }
  .home .author { font-size: 12px; color: #6b5a4c; margin-top: 4px; }
  .home .muted { margin-top: 4px; font-size: 11.5px; }
  .home .groups { flex: none; width: 290px; }
  .home .gqrs { gap: 6px; }
  .home .gc { padding: 6px; margin-top: 6px; gap: 6px; }
  .home .gc.gcv { margin-top: 0; }
  .home .gc .qr { width: 84px; height: 84px; padding: 2px; }
  .home .gc .gn { font-size: 12px; }
  .home .gc .tip, .home .gc .gd { font-size: 11px; }
  .home .gc .gd b { font-size: 13px; }
  .home button.b { font-size: 12px; padding: 2px 10px; }
  .login { margin-right: auto; font-size: 13px; color: #5b4a3c; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .login input { width: 15px; height: 15px; accent-color: #4E8A4A; }
  .login.pending { opacity: .5; cursor: default; }   /* 开机请求确认中：勾着、变淡、点不了 */
  .lnote { margin-right: auto; font-size: 12px; color: #B0482A; white-space: nowrap; }
  .lnote[hidden] { display: none; }
  .stage video { position: absolute; visibility: hidden; pointer-events: none; }
  .stage video.on { visibility: visible; }
  .shadow { position: absolute; width: 120px; height: 18px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(74,52,36,.26), transparent 70%); pointer-events: none; }
  .cursor { position: absolute; width: 20px; left: 0; top: 0; transition: left .7s ease, top .7s ease, opacity .3s; z-index: 5; pointer-events: none; }
  .ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 0 0 3px rgba(127,191,114,.8); animation: rip .45s ease-out forwards; z-index: 4; pointer-events: none; }
  @keyframes rip { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .press { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 4; pointer-events: none; background: conic-gradient(#7FBF72 var(--p, 0%), rgba(127,191,114,.2) 0); -webkit-mask: radial-gradient(circle, transparent 11px, #000 12px); }
  .menu { position: absolute; z-index: 6; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 4px; font-size: 12.5px; min-width: 170px; line-height: 1.4; }
  .menu div { padding: 2px 12px; border-radius: 4px; white-space: nowrap; display: flex; justify-content: space-between; gap: 14px; }
  .menu div.hl { background: #e8f0fb; }
  .menu hr { border: none; border-top: 1px solid #e5e5e5; margin: 3px 0; }
  .bub { position: absolute; z-index: 6; background: #FFFDF7; border: 2px solid #4A3424; border-radius: 14px; padding: 5px 14px; font-size: 15px; white-space: nowrap; transform: translateX(-50%); }
  .bub:after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; background: #FFFDF7; border-right: 2px solid #4A3424; border-bottom: 2px solid #4A3424; transform: rotate(45deg); }
  .keycap { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; z-index: 6; }
  .keycap kbd { font: bold 15px "Microsoft YaHei UI", sans-serif; background: #fff; border: 1.5px solid #4A3424; border-bottom-width: 4px; border-radius: 8px; padding: 3px 12px; color: #3B2A1E; }
  .keycap i { color: #fff; font-style: normal; font-weight: bold; text-shadow: 0 1px 3px #000; }
  .tray { position: absolute; right: 0; bottom: 0; left: 0; height: 26px; background: rgba(240,240,244,.88); backdrop-filter: blur(8px); z-index: 5; }
  .tray img { position: absolute; right: 16px; top: 4px; width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="card">
  <button class="x" data-do="close" title="关闭">×</button>
  <div class="head"><img src="../assets/tray.png" alt=""><div><div class="name">欢迎来到罗小黑大家庭</div><div class="hsub">先看看怎么和小黑玩吧～ 8 段小视频，点右边可以跳着看</div></div></div>
  <div class="top">
    <div class="vid">
      <div class="stage" id="stage"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="home">
    <div class="txt">
      <p><b>罗小黑桌宠由作者个人制作，永久免费。</b></p>
      <p>关于小黑的更新和维护消息，都会发在群里。如果你想要什么功能，欢迎来群里一起探讨。</p>
      <div class="author" id="author"></div>
      <div class="muted">官方群都在右边，其他自称官方的都不是，谨防上当受骗。</div>
      <div class="muted">「罗小黑」角色版权归北京寒木春华动画技术有限公司所有。</div>
    </div>
    <div class="groups" id="groups"></div>
  </div>
  <div class="foot"><label class="login" id="loginlab"><input type="checkbox" id="login"> 开机时让小黑自动出来</label><span class="lnote" id="lnote" role="status" hidden></span><button class="b main" data-do="close">知道了</button></div>
</div>
<script src="groupcard.js"></script>
<script src="tutorial.js"></script>
<script>
const { ipcRenderer } = require('electron');
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sub = document.getElementById('sub'), chips = document.getElementById('chips'), loginBox = document.getElementById('login');
const stage = makeStage(document.getElementById('stage'));
let stopDemo = null, cur = 0, token = 0, loginReady = false;
chips.innerHTML = DEMOS.map((d, i) => `<div class="ch" data-i="${i}"><b>${i + 1}</b>${esc(d.title)}</div>`).join('');
// 整张放大（主进程按屏幕高算好放在 ?zoom=）；报给主进程的是放大后的实际高
// 屏幕放不下时主进程会把倍数缩小（welcome-zoom），所以下限放开到 0.3
const setZoom = (z) => { document.body.style.zoom = Math.max(.3, Math.min(1.12, Number(z) || 1)); };
setZoom(new URLSearchParams(location.search).get('zoom'));
ipcRenderer.on('welcome-zoom', (_e, z) => { setZoom(z); sendSize(); });
function sendSize() { requestAnimationFrame(() => ipcRenderer.send('welcome-size', Math.ceil(document.body.getBoundingClientRect().height))); }
// 播第 i 集；一集播完自动播下一集，最后一集播完回到第 1 集
function pick(i) {
  if (stopDemo) stopDemo();
  cur = i; const my = ++token;
  [...chips.children].forEach((c, j) => c.classList.toggle('on', j === i));
  stopDemo = loopDemo(stage, i, (t) => { sub.textContent = t; }, () => setTimeout(() => { if (my === token) pick((cur + 1) % DEMOS.length); }, 300));
}
function show(s) {
  const a = (s && s.author) || {};
  const el = document.getElementById('author'), sec = el.closest('.txt');
  if (a.name) el.innerHTML = `作者 ${esc(a.name)}　微信 ${esc(a.wechat)}　QQ ${esc(a.qq)}`; else el.innerHTML = '';
  renderGroups(document.getElementById('groups'), s || {}, (s && s.visible) || []);
  sendSize();
}
// 开机自启：初始＝现在的设置；第一次打开（?first=1）默认打勾。变一下就告诉主进程，关卡片前再发一次
// 主进程给 {checked, pending, notice}：确认中勾着变淡点不了；被电脑管家拦了＝取消勾选并在旁边写一行字。
// mainChecked＝主进程那边现在的值；关卡片时只有勾选和它不同才再发一次（被拦后不会反复写注册表）
let mainChecked = false;
function showLogin(s, useDefault) {
  mainChecked = !!s.checked;
  loginBox.checked = useDefault ? true : mainChecked; loginBox.disabled = !!s.pending;
  document.getElementById('loginlab').classList.toggle('pending', !!s.pending);
  const note = document.getElementById('lnote'); note.textContent = s.notice || ''; note.hidden = !s.notice;
  sendSize();
}
ipcRenderer.invoke('welcome-login-state').then((s) => { showLogin(s, new URLSearchParams(location.search).get('first') === '1' && !s.pending && !s.notice); loginReady = true; });
ipcRenderer.on('welcome-login-ui', (_e, s) => showLogin(s, false));
loginBox.addEventListener('change', () => ipcRenderer.send('welcome-login', loginBox.checked));
function closeCard() { if (loginReady && !loginBox.disabled && loginBox.checked !== mainChecked) ipcRenderer.send('welcome-login', loginBox.checked); ipcRenderer.send('welcome-do', 'close'); }
ipcRenderer.invoke('groups-state').then(show);
ipcRenderer.on('welcome', (_e, s) => show(s));
chips.addEventListener('click', (e) => { const c = e.target.closest('.ch'); if (c) pick(+c.dataset.i); });
document.body.addEventListener('click', (e) => { const b = e.target.closest('[data-do]'); if (b) closeCard(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });
pick(0);
sendSize();
</script>
</body>
</html>
